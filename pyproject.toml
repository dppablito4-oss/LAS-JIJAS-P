[project]
name = "las-jijas-asistente"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi==0.162.0", "uvicorn>=0.35,<1", "sqlalchemy>=2.0,<3", "pydantic-settings>=2.10,<3", "python-multipart>=0.0.20", "pillow>=11,<13", "httpx>=0.28,<1", "openai==3.41.0", "sports-skills==0.40.0", "nba_api==1.12.0", "penaltyblog==1.13.1", "tzdata>=2025"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
